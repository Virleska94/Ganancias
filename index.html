<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Margen de Ganancia</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .card p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .suffix {
      position: absolute;
      right: 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      display: none;
    }

    .result-box.active {
      display: block;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .result-item:last-child {
      margin-bottom: 0;
      padding-top: 0.5rem;
      border-top: 1px dashed #93c5fd;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Cálculo de Margen</h1>
    <p class="subtitle">Introduce los datos para calcular la ganancia total</p>

    <form id="calcForm">
      <div class="form-group">
        <label for="km">Kilómetros</label>
        <div class="input-wrapper">
          <input type="number" id="km" placeholder="0" step="any" required min="0">
          <span class="suffix">km</span>
        </div>
      </div>

      <div class="form-group">
        <label for="precio">Precio por Kilómetro</label>
        <div class="input-wrapper">
          <input type="number" id="precio" placeholder="0.00" step="any" required min="0">
          <span class="suffix">$</span>
        </div>
      </div>

      <div class="form-group">
        <label for="porcentaje">Porcentaje de Ganancia</label>
        <div class="input-wrapper">
          <input type="number" id="porcentaje" placeholder="0" step="any" required min="0" max="100">
          <span class="suffix">%</span>
        </div>
      </div>

      <button type="submit">Calcular Margen</button>
    </form>

    <div class="result-box" id="resultBox">
      <div class="result-item">
        <span>Costo Total Base:</span>
        <span id="resBase">$0.00</span>
      </div>
      <div class="result-item">
        <span>Ganancia:</span>
        <span id="resGanancia">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('calcForm').addEventListener('submit', function(event) {
      event.preventDefault();

      // Obtener valores de los inputs
      const km = parseFloat(document.getElementById('km').value) || 0;
      const precio = parseFloat(document.getElementById('precio').value) || 0;
      const porcentaje = parseFloat(document.getElementById('porcentaje').value) || 0;

      // Cálculos
      const costoBase = km * precio;
      const margenGanancia = costoBase * (porcentaje / 100);

      // Formatear a moneda ($)
      const formatoMoneda = (valor) => {
        return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'USD' }).format(valor);
      };

      // Mostrar resultados
      document.getElementById('resBase').textContent = formatoMoneda(costoBase);
      document.getElementById('resGanancia').textContent = formatoMoneda(margenGanancia);

      // Activar el contenedor del resultado
      document.getElementById('resultBox').classList.add('active');
    });
  </script>

</body>
</html>
